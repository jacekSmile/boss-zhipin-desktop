name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
            cft: win64
          - platform: ubuntu-22.04
            args: ""
            cft: linux64
          - platform: ubuntu-24.04-arm
            args: ""
            cft: ""
          - platform: macos-13
            args: "--target x86_64-apple-darwin"
            cft: mac-x64
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
            cft: mac-arm64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Chrome for Testing (bundled browser)
        shell: bash
        run: |
          set -e
          mkdir -p vendor/browser
          if [ -z "${{ matrix.cft }}" ]; then
            echo "No Chrome for Testing build for this platform; skipping bundled browser (runtime falls back to system browser)."
            exit 0
          fi
          cd vendor/browser
          curl -sL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json -o cft.json
          URL=$(node -e "const j=require('./cft.json');console.log(j.channels.Stable.downloads.chrome.find(d=>d.platform==='${{ matrix.cft }}').url)")
          echo "Downloading $URL"
          curl -sL -o cft.zip "$URL"
          tar -xf cft.zip
          rm cft.zip cft.json
          ls

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "BOSS直聘求职助手 ${{ steps.tag.outputs.tag }}"
          releaseBody: "见 README 安装说明。macOS 未签名，首次打开请执行: xattr -dr com.apple.quarantine /Applications/BOSS直聘求职助手.app"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
