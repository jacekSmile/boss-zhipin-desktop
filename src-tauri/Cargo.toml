[package]
name = "boss-zhipin-desktop"
version = "0.2.0"
description = "BOSS直聘求职助手 - 跨平台桌面端"
edition = "2021"
rust-version = "1.77"

[lib]
name = "boss_zhipin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "process", "net"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rand = "0.9"
base64 = "0.22"
